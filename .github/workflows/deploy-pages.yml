name: Deploy GADL to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout GADL
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install GADL dependencies
        run: npm ci

      - name: Build GADL
        run: npm run build

      - name: Checkout exact rs-map-viewer source
        run: |
          git clone https://github.com/dennisdev/rs-map-viewer.git .rs-map-viewer
          cd .rs-map-viewer
          git checkout d3c569b1cde38aac6182dd141fc4c84beaf06798

      - name: Patch viewer for GitHub Pages and OmniRune player demo
        run: |
          python3 - <<'PY'
          from pathlib import Path

          caches = Path(".rs-map-viewer/src/mapviewer/Caches.ts")
          text = caches.read_text()
          text = text.replace(
              'const CACHE_PATH = "/caches/";',
              'const CACHE_PATH = (process.env.PUBLIC_URL || "") + "/caches/";'
          )
          text = text.replace(
              '        true,\n        signal,',
              '        false,\n        signal,'
          )
          caches.write_text(text)

          app = Path(".rs-map-viewer/src/mapviewer/MapViewerApp.tsx")
          text = app.read_text()
          text = text.replace(
              'const workerPool = RenderDataWorkerPool.create(isWallpaperEngine ? 1 : 4);',
              'const workerPool = RenderDataWorkerPool.create(1);'
          )
          app.write_text(text)

          # Proof of concept: inject one human RuneScape model at Lumbridge.
          # It uses the viewer's existing NPC model/animation/path pipeline so
          # we can prove live character movement before wiring headless state.
          spawn_file = Path(".rs-map-viewer/src/mapviewer/data/npc/NpcSpawn.ts")
          text = spawn_file.read_text()
          text = text.replace(
              'export async function fetchNpcSpawns(url: string): Promise<NpcSpawn[]> {\n    const response = await fetch(url);\n    return await response.json();\n}',
              '''export async function fetchNpcSpawns(url: string): Promise<NpcSpawn[]> {
    const response = await fetch(url);
    const spawns: NpcSpawn[] = await response.json();

    // OmniRune player-model proof of concept. Hans is a human-shaped OSRS
    // model with normal idle/walk sequences, placed beside Lumbridge Castle.
    if (url === npcSpawnsOsrsUrl) {
        spawns.push({ id: 310, name: "OmniRune Player", x: 3222, y: 3218, level: 0 });
    }

    return spawns;
}'''
          )
          spawn_file.write_text(text)

          npc_file = Path(".rs-map-viewer/src/mapviewer/webgl/npc/Npc.ts")
          text = npc_file.read_text()
          text = text.replace(
              '    serverPathLength: number = 0;\n\n    x: number;',
              '    serverPathLength: number = 0;\n\n    omniDemoTick: number = 0;\n    omniDemoStep: number = 0;\n\n    x: number;'
          )
          needle = '''    updateServerMovement(
        pathfinder: Pathfinder,
        borderSize: number,
        collisionMaps: CollisionMap[],
    ) {
        const size = this.getSize();'''
          replacement = '''    updateServerMovement(
        pathfinder: Pathfinder,
        borderSize: number,
        collisionMaps: CollisionMap[],
    ) {
        const size = this.getSize();

        // Deterministic walking loop for the injected OmniRune human model.
        // 3222,3218 is local (22,18) inside map-square 50,50.
        if (this.npcType.id === 310 && this.spawnX === 22 && this.spawnY === 18) {
            this.omniDemoTick++;
            if (this.pathLength === 0 && this.omniDemoTick >= 18) {
                this.omniDemoTick = 0;
                const route = [
                    [26, 18],
                    [26, 22],
                    [22, 22],
                    [22, 18],
                ];
                const target = route[this.omniDemoStep % route.length];
                this.omniDemoStep++;
                this.queuePath(target[0], target[1], MovementType.WALK);
            }
            return;
        }'''
          if needle not in text:
              raise SystemExit("Npc updateServerMovement patch point not found")
          text = text.replace(needle, replacement)
          npc_file.write_text(text)

          downloader = Path(".rs-map-viewer/scripts/download-caches.js")
          text = downloader.read_text()
          text = text.replace(
              '        await askQuestion("Downloading ~" + formatBytes(totalBytes) + ". Press enter to continue.");',
              '        console.log("Downloading ~" + formatBytes(totalBytes) + ".");'
          )
          downloader.write_text(text)
          PY

      - name: Install rs-map-viewer dependencies
        working-directory: .rs-map-viewer
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile

      - name: Download latest OSRS cache for 3D renderer
        working-directory: .rs-map-viewer
        run: yarn download-caches 1

      - name: Build exact rs-map-viewer
        working-directory: .rs-map-viewer
        env:
          PUBLIC_URL: /GADL/map
          CI: "false"
        run: yarn build

      - name: Publish 3D viewer and cache under GADL map path
        run: |
          mkdir -p dist/map
          cp -a .rs-map-viewer/build/. dist/map/
          cp -a .rs-map-viewer/caches dist/map/caches

      - name: Verify 3D world build
        run: |
          test -f dist/map/index.html
          test -f dist/map/caches/caches.json
          echo "3D viewer index:"
          ls -lh dist/map/index.html
          echo "Published cache:"
          cat dist/map/caches/caches.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
