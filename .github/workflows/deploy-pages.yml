name: Deploy GADL to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout GADL
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install GADL dependencies
        run: npm ci

      - name: Build GADL
        run: npm run build

      - name: Checkout exact rs-map-viewer source
        run: |
          git clone https://github.com/dennisdev/rs-map-viewer.git .rs-map-viewer
          cd .rs-map-viewer
          git checkout d3c569b1cde38aac6182dd141fc4c84beaf06798

      - name: Patch viewer for OmniRune
        run: python3 scripts/patch-map-viewer.py

      - name: Install rs-map-viewer dependencies
        working-directory: .rs-map-viewer
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile

      - name: Download latest OSRS cache for 3D renderer
        working-directory: .rs-map-viewer
        run: yarn download-caches 1

      - name: Build exact rs-map-viewer
        working-directory: .rs-map-viewer
        env:
          PUBLIC_URL: /GADL/map
          CI: "false"
        run: yarn build

      - name: Publish 3D viewer and cache under GADL map path
        run: |
          mkdir -p dist/map
          cp -a .rs-map-viewer/build/. dist/map/
          cp -a .rs-map-viewer/caches dist/map/caches

      - name: Verify 3D world build
        run: |
          test -f dist/map/index.html
          test -f dist/map/caches/caches.json
          echo "3D viewer index:"
          ls -lh dist/map/index.html
          echo "Published cache:"
          cat dist/map/caches/caches.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
